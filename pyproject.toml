[project]
name = "sidhe-whatsapp-agent"
version = "0.1.0"
description = "Agente conversacional de atención a clientes por WhatsApp para Sidhe Group"
requires-python = ">=3.12"
dependencies = [
    # API / servidor
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.20",  # FastAPI lo necesita para leer los forms de Twilio
    # Agente
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langchain-anthropic>=1.4.8",
    "langmem>=0.0.30",
    "anthropic>=0.116.0",
    # Base de datos
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.18.5",
    "pgvector>=0.5.0",
    # Canales / servicios
    "twilio>=9.10.9",
    "groq>=1.5.0",
    "openai>=2.45.0",
    "httpx>=0.28.1",
    # Config / logging
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidhe_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
